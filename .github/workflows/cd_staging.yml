name: Deploy to staging
on:
  push:
    branches: [main]
jobs:
  redeploy_everything:
    runs-on: ubuntu-latest
    name: Deploying everything to the stagin cluster

    steps:
      - run: |
          echo "${{secrets.SSH_PRIVATE_KEY}}" &> ~/ssh_key
          mkdir -p /home/runner/.ssh
          ls /home/runner/.ssh
          touch /home/runner/.ssh/known_hosts
          echo "${{secrets.KNOWN_HOST}}" &> /home/runner/.ssh/known_hosts
          chmod 700 /home/runner/ssh        
          ssh -i ~/.ssh/id_rsa_do root@143.244.143.156 -t "
          cd devops_test_monorepo/ && git pull origin main && export PATH=/root/.nvm/versions/node/v22.15.0/bin/node && pnpm install && pnpm run build && pm2 restart fe-server &&pm2 restart http-server && pm2 restart ws-server
          "
