name: Deploy to staging
on:
  push:
    branches:
      - "main"
jobs:
  redeploy_everything:
    name: Deploying everything to the stagin cluster

    steps:
      - name: SSH into server
      - run: |
          echo ${{secrets.SSH_PRIVATE_KEY}} &> ~/ssh_key
          ssh -i ~/.ssh/id_rsa_do root@143.244.143.156
          cd devops_test_monorepo/ && git pull
          pnpm install
          pnpm run build
          pm2 restart fe-server
          pm2 restart http-server
          pm2 restart ws-server
